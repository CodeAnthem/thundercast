name: tcast selftest

on:
  push:
    branches: [main, master]
    paths:
      - 'tcast/**'
      - 'utilities/bashTestSuite/**'
      - '.github/workflows/tcast-selftest.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'tcast/**'
      - 'utilities/bashTestSuite/**'
      - '.github/workflows/tcast-selftest.yml'

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: tcast selftest
        run: bash tcast/dev/selftest.sh

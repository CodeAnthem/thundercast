name: fleet selftest

on:
  push:
    branches: [main, master]
    paths:
      - 'fleet/**'
      - 'utilities/bashTestSuite/**'
      - '.github/workflows/fleet-selftest.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'fleet/**'
      - 'utilities/bashTestSuite/**'
      - '.github/workflows/fleet-selftest.yml'

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install age + sops
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /tmp/sops
          sudo install -m755 /tmp/sops /usr/local/bin/sops
      - name: fleet selftest
        run: bash fleet/dev/selftest.sh

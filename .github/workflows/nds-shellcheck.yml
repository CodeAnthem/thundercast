name: NDS shellcheck

on:
  push:
    branches: [main, master]
    paths:
      - 'nds/**'
      - '.github/scripts/**'
      - '.shellcheckrc'
      - '.github/workflows/nds-shellcheck.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'nds/**'
      - '.github/scripts/**'
      - '.shellcheckrc'
      - '.github/workflows/nds-shellcheck.yml'

jobs:
  shellcheck:
    if: false # Disabled. Remove this line to turn the workflow back on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: NDS shellcheck
        run: bash nds/dev/shellcheck.sh

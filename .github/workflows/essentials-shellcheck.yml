name: essentials shellcheck

on:
  push:
    branches: [main, master]
    paths:
      - 'utilities/essentials/**'
      - '.github/scripts/**'
      - '.shellcheckrc'
      - '.github/workflows/essentials-shellcheck.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'utilities/essentials/**'
      - '.github/scripts/**'
      - '.shellcheckrc'
      - '.github/workflows/essentials-shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: essentials shellcheck
        run: bash utilities/essentials/dev/shellcheck.sh
